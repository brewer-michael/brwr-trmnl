name: Firmware

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [brwr_trmnl, brwr_trmnl_arduino]
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini', 'firmware/sdkconfigs/sdkconfig.brwr_trmnl') }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PlatformIO
        run: pip install --upgrade platformio==6.1.19

      - name: Build
        run: pio run -e ${{ matrix.env }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.env }}
          path: |
            firmware/.pio/build/${{ matrix.env }}/merged_firmware.bin
            firmware/.pio/build/${{ matrix.env }}/firmware.bin
            firmware/.pio/build/${{ matrix.env }}/bootloader.bin
            firmware/.pio/build/${{ matrix.env }}/partitions.bin
          if-no-files-found: error
