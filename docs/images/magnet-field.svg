<text class="tick" x="68" y="274.7" text-anchor="end">5</text>
<line x1="78" x2="690" y1="234.1" y2="234.1" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="68" y="238.1" text-anchor="end">10</text>
<line x1="78" x2="690" y1="197.5" y2="197.5" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="68" y="201.5" text-anchor="end">20</text>
<line x1="78" x2="690" y1="149.0" y2="149.0" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="68" y="153.0" text-anchor="end">50</text>
<line x1="78" x2="690" y1="112.4" y2="112.4" stroke="var(--grid)" stroke-width="1"/>
