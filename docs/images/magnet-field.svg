<text class="tick" x="537.0" y="476" text-anchor="middle">60</text>
<line x1="613.5" x2="613.5" y1="456" y2="461" stroke="var(--axis)" stroke-width="1"/>
<text class="tick" x="613.5" y="476" text-anchor="middle">70</text>
<line x1="690.0" x2="690.0" y1="456" y2="461" stroke="var(--axis)" stroke-width="1"/>
<text class="tick" x="690.0" y="476" text-anchor="middle">80</text>
<line x1="78" x2="690" y1="456" y2="456" stroke="var(--axis)" stroke-width="1"/>
<text class="axis-label" x="384" y="504" text-anchor="middle">Distance from the magnet (mm): from its edge sideways, from its face straight out</text>
<text class="axis-label" transform="translate(20,260) rotate(-90)" text-anchor="middle">Field (mT)</text>
<line x1="78" x2="690" y1="270.7" y2="270.7" stroke="var(--ink2)" stroke-width="1"/>
<text class="note" x="684" y="264.7" text-anchor="end">Design limit at an inductor, 5 mT</text>
<line x1="282.6" x2="282.6" y1="64" y2="456" stroke="var(--ink2)" stroke-width="1"/>
<text class="note" x="288.6" y="78">Closest board to a magnet, 26.75 mm</text>
