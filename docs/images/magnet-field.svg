<text class="tick" x="68" y="396.4" text-anchor="end">0.5</text>
<line x1="78" x2="690" y1="355.8" y2="355.8" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="68" y="359.8" text-anchor="end">1</text>
<line x1="78" x2="690" y1="319.1" y2="319.1" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="68" y="323.1" text-anchor="end">2</text>
