<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="t d">
<title id="t">Magnet field strength versus distance</title>
<desc id="d">Worst-case field of a bare 20 by 3 mm N52 disc magnet, on a log scale. Sideways, toward the boards, it drops below 5 millitesla by about 19.5 mm from the magnet's edge; straight out from the face it takes about 32.5 mm. The closest board is 26.75 mm from a magnet's edge, where the field is 2.4 millitesla.</desc>
<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
         --s1:#2a78d6; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
           --s1:#3987e5; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .title { font-size:17px; font-weight:600; fill:var(--ink); }
  .sub { font-size:13px; fill:var(--ink2); }
  .tick { font-size:12px; fill:var(--muted); font-variant-numeric: tabular-nums; }
  .axis-label { font-size:12px; fill:var(--ink2); }
  .label { font-size:13px; fill:var(--ink); }
  .note { font-size:12px; fill:var(--ink2); }
</style>
